<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Golden Ads [DEBUG MODE]</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --tg-theme-bg-color: #0f172a;
            --tg-theme-secondary-bg-color: #1e293b;
            --tg-theme-accent: #38bdf8;
            --tg-theme-text: #f8fafc;
        }
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding-bottom: 80px;
        }
        .active-tab {
            color: var(--tg-theme-accent);
            border-top: 2px solid var(--tg-theme-accent);
        }
    </style>
</head>
<body>

    <!-- BOTÓN DE EMERGENCIA PARA LIMPIAR TODO -->
    <div class="fixed top-20 left-4 z-50">
        <button onclick="localStorage.clear(); alert('¡Memoria del teléfono limpia a la fuerza!'); location.reload();" class="bg-red-600 hover:bg-red-700 text-white font-black text-xs px-3 py-2 rounded-xl shadow-lg border border-red-400">
            💥 DESTRUIR MEMORIA VIEJA
        </button>
    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="global-loader" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-sky-500 border-t-transparent"></div>
        <h2 class="mt-4 font-bold text-slate-300">Cargando modo Debug...</h2>
    </div>

    <!-- HEADER / CESTA -->
    <header class="sticky top-0 bg-slate-900/90 backdrop-blur-md p-4 flex justify-between items-center z-40 border-b border-slate-800">
        <h1 class="text-xl font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">Lista Golden Ads</h1>
        <button onclick="openCartModal()" class="bg-gradient-to-r from-sky-500 to-indigo-600 px-4 py-2 rounded-full font-bold text-sm flex items-center gap-2">
            <i class="fa-solid fa-basket-shopping"></i>
            <span>Cesta</span>
            <span id="cart-count" class="bg-white text-slate-950 text-xs w-5 h-5 rounded-full flex items-center justify-center font-black">0</span>
        </button>
    </header>

    <!-- CATÁLOGO -->
    <main id="view-catalog" class="p-4 max-w-4xl mx-auto space-y-6">
        <div id="channels-container" class="grid gap-4 sm:grid-cols-2"></div>
    </main>

    <!-- MODAL DEL CARRITO MODIFICADO PARA REVISAR VARIABLES -->
    <div id="cart-modal" class="fixed inset-0 bg-black/80 z-50 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl border border-slate-800 shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-850">
                <h3 class="font-bold text-slate-200">🔍 Consola de Diagnóstico de la Cesta</h3>
                <button onclick="closeCartModal()" class="text-slate-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- Productos añadidos -->
            <div id="cart-items" class="p-4 overflow-y-auto space-y-3 flex-1"></div>

            <!-- ================= VENTANA DE DEBUG (MUESTRA LAS TRIPAS DEL SISTEMA) ================= -->
            <div class="p-3 bg-slate-950 border-t border-yellow-600/30 space-y-2">
                <p class="text-[11px] font-bold text-yellow-400"><i class="fa-solid fa-bug mr-1"></i> VARIABLES DEL CARRITO EN TIEMPO REAL:</p>
                <textarea id="debug-json-box" class="w-full h-20 bg-slate-900 text-emerald-400 font-mono text-[10px] p-2 border border-slate-800 rounded-lg" readonly placeholder="Ningún dato todavía..."></textarea>
                
                <p class="text-[11px] font-bold text-sky-400"><i class="fa-solid fa-link mr-1"></i> ENLACE FINAL QUE SE VA A ABRIR:</p>
                <textarea id="debug-url-box" class="w-full h-20 bg-slate-900 text-sky-300 font-mono text-[10px] p-2 border border-slate-800 rounded-lg" readonly placeholder="Generando enlace..."></textarea>
            </div>
            <!-- ===================================================================================== -->

            <div class="p-4 bg-slate-950 border-t border-slate-800 space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-slate-400 text-sm">Total Estimado:</span>
                    <span id="cart-total" class="text-xl font-black text-emerald-400">$0.00 USD</span>
                </div>
                <button onclick="checkout()" class="w-full bg-emerald-600 p-3 rounded-xl font-bold text-center text-sm flex justify-center items-center gap-2">
                    <i class="fa-brands fa-telegram"></i> Probar Envío a Telegram
                </button>
            </div>
        </div>
    </div>

    <script>
        const MI_TELEGRAM_USER = "Airdayz";

        const canalesData = [
            {
                id: 1,
                nombre: "Crypto Alertas Pro",
                username: "crypto_alertas_test",
                categoria: "Finanzas",
                subs: 45000,
                precioBase: 50,
                descuento: 15,
                imagen: "https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=150"
            },
            {
                id: 2,
                nombre: "Tech & Gadgets Mundiales",
                username: "tech_gadgets_test",
                categoria: "Tecnología",
                subs: 120000,
                precioBase: 90,
                descuento: 0,
                imagen: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=150"
            },
            {
                id: 3,
                nombre: "Memes & Humor Viral",
                username: "memes_humor_test",
                categoria: "Entretenimiento",
                subs: 85000,
                precioBase: 30,
                descuento: 30,
                imagen: "https://images.unsplash.com/photo-1531256374423-a33502219008?w=150"
            }
        ];

        let carrito = JSON.parse(localStorage.getItem('ads_carrito')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            renderChannels();
            updateCartBadge();
            setTimeout(() => document.getElementById('global-loader').remove(), 500);
        });

        function renderChannels() {
            const container = document.getElementById('channels-container');
            container.innerHTML = '';
            
            canalesData.forEach(c => {
                const precio = c.descuento > 0 ? c.precioBase * (1 - c.descuento/100) : c.precioBase;
                const card = document.createElement('div');
                card.className = "bg-slate-800/40 rounded-2xl p-4 border border-slate-700/60 flex flex-col justify-between";
                card.innerHTML = `
                    <div class="flex gap-3 items-center">
                        <img src="${c.imagen}" class="w-10 h-10 rounded-xl object-cover" alt="">
                        <div>
                            <h3 class="font-bold text-sm text-slate-200">${c.nombre}</h3>
                            <p class="text-xs text-slate-400">$${precio.toFixed(2)} USD</p>
                        </div>
                    </div>
                    <button onclick="addToCart(${c.id})" class="mt-3 w-full bg-sky-600 py-1.5 rounded-xl text-xs font-bold text-white">
                        + Añadir Cesta
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function addToCart(id) {
            // Generamos un objeto limpio y plano sin referencias externas problemáticas
            const nuevoItem = {
                registroId: Date.now() + Math.floor(Math.random() * 1000),
                idDelCanalElegido: parseInt(id)
            };

            carrito.push(nuevoItem);
            localStorage.setItem('ads_carrito', JSON.stringify(carrito));
            updateCartBadge();
            alert("Añadido. Abre la cesta arriba para auditar las variables.");
        }

        function updateCartBadge() {
            document.getElementById('cart-count').innerText = carrito.length;
        }

        function openCartModal() {
            const modal = document.getElementById('cart-modal');
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            let total = 0;

            modal.classList.remove('hidden');

            // 1. Mostrar JSON crudo en la caja de debug para ver si se guardan IDs erróneos
            document.getElementById('debug-json-box').value = JSON.stringify(carrito, null, 2);

            if(carrito.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-4 text-xs">Cesta vacía.</p>`;
                document.getElementById('cart-total').innerText = "$0.00 USD";
                document.getElementById('debug-url-box').value = "Ninguno - Cesta vacía";
                return;
            }

            // 2. Construir la vista física de la cesta
            carrito.forEach(item => {
                const datosCanal = canalesData.find(c => c.id === item.idDelCanalElegido);
                if (!datosCanal) return;

                let precioItem = datosCanal.descuento > 0 ? datosCanal.precioBase * (1 - datosCanal.descuento/100) : datosCanal.precioBase;
                total += precioItem;

                const div = document.createElement('div');
                div.className = "bg-slate-800 p-2 rounded-xl flex justify-between items-center text-xs";
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-200">${datosCanal.nombre}</h4>
                        <span class="text-emerald-400 font-mono">ID Buscado: ${item.idDelCanalElegido}</span>
                    </div>
                    <button onclick="removeFromCart(${item.registroId})" class="text-rose-400 px-2"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(div);
            });

            document.getElementById('cart-total').innerText = `$${total.toFixed(2)} USD`;

            // 3. Simular y previsualizar la URL de Telegram exacta que va a dispararse
            generarPrevisualizacionURL(total);
        }

        function generarPrevisualizacionURL(total) {
            let texto = "¡Hola! Mi pedido:\n";
            carrito.forEach((item, index) => {
                const canal = canalesData.find(c => c.id === item.idDelCanalElegido);
                if(canal) {
                    texto += `${index + 1}. ${canal.nombre}\n`;
                }
            });
            texto += `Total: $${total.toFixed(2)} USD`;
            
            document.getElementById('debug-url-box').value = "https://t.me/" + MI_TELEGRAM_USER + "?text=" + encodeURIComponent(texto);
        }

        function removeFromCart(registroId) {
            carrito = carrito.filter(item => item.registroId !== registroId);
            localStorage.setItem('ads_carrito', JSON.stringify(carrito));
            updateCartBadge();
            openCartModal();
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function checkout() {
            if(carrito.length === 0) return alert("Cesta vacía.");
            const urlAabrir = document.getElementById('debug-url-box').value;
            window.open(urlAabrir, "_blank");
        }
    </script>
</body>
</html>
