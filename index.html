<!-- SECCIÓN DEL CARRITO -->
<div id="carrito-container" class="p-4 bg-white rounded-lg shadow">
  <h2 class="text-xl font-bold mb-4">Tu Carrito de Compra</h2>
  
  <!-- Lista de Canales en el Carrito -->
  <div id="lista-carrito" class="space-y-4 mb-6">
    <!-- Ejemplo de tarjeta de canal con todas sus opciones restauradas -->
    <div class="border p-4 rounded-md bg-gray-50" data-canal-id="123">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="font-bold text-lg">Canal de Tecnología Top</h3>
          <!-- DESCRIPCIÓN RESTAURADA -->
          <p class="text-sm text-gray-600 my-1">Canal especializado en reviews y reviews de gadgets con alta tasa de conversión.</p>
        </div>
        <span class="text-blue-600 font-bold" id="precio-total-canal">$50.00</span>
      </div>

      <!-- OPCIONES DE MEJORA RESTAURADAS -->
      <div class="mt-3 pt-3 border-t border-gray-200">
        <p class="text-xs font-semibold text-gray-500 uppercase">Opciones de Mejora (Aumenta el alcance):</p>
        
        <div class="flex flex-col sm:flex-row gap-4 mt-2">
          <!-- Opción por Días -->
          <label class="flex items-center space-x-2 text-sm bg-white p-2 border rounded cursor-pointer flex-1">
            <input type="radio" name="mejora-123" value="dias" class="opcion-mejora" data-extra="15.00" checked>
            <div>
              <span class="font-medium">Plan por Días (+ $15.00)</span>
              <p class="text-xs text-gray-400">Mantenlo activo por 3 días completos</p>
            </div>
          </label>

          <!-- Opción por Horas Fijadas -->
          <label class="flex items-center space-x-2 text-sm bg-white p-2 border rounded cursor-pointer flex-1">
            <input type="radio" name="mejora-123" value="horas" class="opcion-mejora" data-extra="25.00">
            <div>
              <span class="font-medium">Fijado por X Horas (+ $25.00)</span>
              <p class="text-xs text-gray-400">Fijado en el top durante 6 horas continuas</p>
            </div>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- SELECTOR DE MÉTODO DE PAGO CORREGIDO -->
  <div class="border-t pt-4">
    <label for="metodo-pago" class="block text-sm font-medium text-gray-700 mb-2">Selecciona tu Método de Pago:</label>
    <select id="metodo-pago" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 bg-white">
      <option value="" disabled selected>-- Elige cómo quieres pagar --</option>
      <option value="tarjeta">Tarjeta de Crédito / Débito</option>
      <option value="paypal">PayPal</option>
      <option value="crypto">Criptomonedas</option>
      <option value="saldo">Saldo de la Cuenta</option>
    </select>
  </div>

  <button id="btn-proceder-pago" class="w-full mt-4 bg-green-600 text-white p-3 rounded-md font-bold hover:bg-green-700 transition">
    Proceder al Pago
  </button>
</div>

<script>
  // Lógica para que el selector funcione y capte los cambios de precio de las mejoras
  document.addEventListener('DOMContentLoaded', () => {
    const selectorPago = document.getElementById('metodo-pago');
    const btnPago = document.getElementById('btn-proceder-pago');

    // Listener del selector de pago corrigiendo el bloqueo anterior
    selectorPago.addEventListener('change', (e) => {
      console.log(`Método de pago seleccionado de forma efectiva: ${e.target.value}`);
    });

    // Listener para actualizar precios según las opciones de mejora seleccionadas
    document.querySelectorAll('.opcion-mejora').forEach(radio => {
      radio.addEventListener('change', function() {
        const precioBase = 50.00; // Ejemplo dinámico
        const extra = parseFloat(this.getAttribute('data-extra'));
        const totalContenedor = this.closest('[data-canal-id]').querySelector('#precio-total-canal');
        totalContenedor.textContent = `$${(precioBase + extra).toFixed(2)}`;
      });
    });

    btnPago.addEventListener('click', () => {
      if (!selectorPago.value) {
        alert('Por favor, selecciona un método de pago antes de continuar.');
        return;
      }
      alert(`Procesando compra con: ${selectorPago.value}`);
    });
  });
</script>
